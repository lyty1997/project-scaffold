<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__BRAND_NAME__</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      color: #1a1a1a;
      background: #fafafa;
    }
    main { box-sizing: border-box; width: 100%; max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; }
    .tagline { color: #555; font-size: 1.1rem; margin: 0 0 2rem; }
    .note { border-left: 3px solid #ddd; padding: 0.25rem 0 0.25rem 1rem; color: #666; font-size: 0.95rem; overflow-wrap: anywhere; }
    code { background: rgba(0,0,0,0.06); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      body { color: #e6e6e6; background: #16171a; }
      .tagline { color: #aaa; }
      .note { border-left-color: #444; color: #999; }
      code { background: rgba(255,255,255,0.1); }
    }
  </style>
</head>

  <main>
    <h1>__BRAND_NAME__</h1>
    <p class="tagline">__PROJECT_TAGLINE__</p>
    <p class="note">

      Replace or remove it after choosing the technology stack, update
      <code>docs/contracts/site-checks.json</code>, and keep the design in <code>docs/</code> in sync.

</html>
