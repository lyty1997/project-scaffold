<!doctype html>
<html lang="$lang$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="portable-source" content="$portable-source$">
  <meta name="portable-input-sha256" content="$portable-input-sha256$">
  <meta name="portable-image-count" content="$portable-image-count$">
  <meta name="portable-pandoc-version" content="$portable-pandoc-version$">
  <title>$pagetitle$</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f4f7fb;
      --surface: #ffffff;
      --surface-muted: #eef4fa;
      --text: #172033;
      --muted: #5f6b7a;
      --border: #d7e0ea;
      --accent: #0f6cbd;
      --accent-soft: #e4f1fc;
      --code: #f3f5f7;
      --shadow: 0 18px 50px rgba(36, 53, 77, 0.1);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .portable-shell {
      width: min(100% - 32px, 980px);
      margin: 32px auto 64px;
    }

    .portable-header,
    #TOC,
    .portable-document,
    .portable-footer {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .portable-header {
      margin-bottom: 20px;
      padding: 20px 24px;
      background: linear-gradient(135deg, var(--accent-soft), var(--surface));
    }

    .portable-eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .portable-header p:last-child,
    .portable-footer p { margin: 0; }

    #TOC {
      max-height: min(42vh, 560px);
      margin-bottom: 20px;
      padding: 20px 24px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    #TOC::before {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      content: "目录";
      font-size: 0.86rem;
      font-weight: 700;
    }

    #TOC ul { margin: 0; padding-left: 1.35rem; }
    #TOC li + li { margin-top: 4px; }

    .portable-document { padding: clamp(24px, 5vw, 56px); }
    .portable-document > :first-child { margin-top: 0; }
    .portable-document > :last-child { margin-bottom: 0; }

    h1, h2, h3, h4 {
      line-height: 1.3;
      scroll-margin-top: 24px;
    }

    h1 { margin: 0 0 1.4rem; font-size: clamp(2rem, 6vw, 3.25rem); }
    h2 { margin: 2.7rem 0 1rem; padding-top: 0.3rem; font-size: clamp(1.5rem, 4vw, 2rem); }
    h3 { margin: 2rem 0 0.8rem; font-size: 1.3rem; }
    h4 { margin: 1.5rem 0 0.6rem; font-size: 1.08rem; }

    a { color: var(--accent); text-underline-offset: 0.2em; }
    a:hover { text-decoration-thickness: 2px; }

    .portable-local-link {
      border-bottom: 1px dashed var(--muted);
      color: inherit;
      cursor: help;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.5rem auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
    }

    blockquote {
      margin: 1.5rem 0;
      padding: 0.8rem 1.1rem;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      background: var(--surface-muted);
      color: var(--muted);
    }

    blockquote > :first-child { margin-top: 0; }
    blockquote > :last-child { margin-bottom: 0; }

    code {
      padding: 0.12em 0.34em;
      border-radius: 5px;
      background: var(--code);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.9em;
    }

    pre {
      max-width: 100%;
      padding: 18px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--code);
      line-height: 1.55;
    }

    pre code { padding: 0; background: transparent; }

    table {
      display: block;
      width: 100%;
      margin: 1.5rem 0;
      overflow-x: auto;
      border-spacing: 0;
      border-collapse: collapse;
    }

    th, td {
      min-width: 9rem;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th { background: var(--surface-muted); }
    hr { margin: 2.5rem 0; border: 0; border-top: 1px solid var(--border); }

    .portable-footer {
      margin-top: 20px;
      padding: 18px 24px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    @media (max-width: 640px) {
      body { font-size: 16px; }
      .portable-shell { width: min(100% - 20px, 980px); margin-top: 10px; }
      .portable-header, #TOC, .portable-document, .portable-footer { border-radius: 12px; }
      .portable-header, #TOC { padding: 16px; }
      #TOC { max-height: 38vh; }
      .portable-document { padding: 24px 18px; }
      th, td { min-width: 7.5rem; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #10151d;
        --surface: #171e28;
        --surface-muted: #202a36;
        --text: #e8edf4;
        --muted: #aab6c5;
        --border: #344253;
        --accent: #74b9f2;
        --accent-soft: #18334a;
        --code: #111821;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }
    }

    @media print {
      :root { color-scheme: light; }
      body { background: #ffffff; color: #111827; }
      .portable-shell { width: 100%; margin: 0; }
      .portable-header, #TOC, .portable-document, .portable-footer {
        border: 0;
        box-shadow: none;
      }
      .portable-document { padding: 0; }
      a { color: inherit; }
    }
  </style>
</head>
<body>
  <div class="portable-shell">
    <header class="portable-header">
      <p class="portable-eyebrow">Portable document</p>
      <p>本文件已内嵌本地图片，可以单独移动。仓库内交互图、Typed JSON 和其他相对链接在便携版中仅保留路径提示。</p>
    </header>
$if(toc)$
    <nav id="$idprefix$TOC" role="doc-toc">
$table-of-contents$
    </nav>
$endif$
    <main class="portable-document">
$body$
    </main>
    <footer class="portable-footer">
      <p>源文档：<code>$portable-source$</code> · 输入摘要：<code>$portable-input-sha256$</code></p>
    </footer>
  </div>
</body>
</html>
